<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muyu 2.0 — Matriz Anatómica (12 Formas + 4 Reacciones)</title>
    <style>
      :root {
        --forest-dark: #1E3A2F;
        --forest-green: #2D6A4F;
        --forest-leaf: #40916C;
        --forest-light: #D8F3DC;
        --forest-bg: #F4F9F4;
        --card-bg: #FFFFFF;
        --sun-gold: #FFD166;
        --text-main: #1D2D24;
        --text-muted: #52675B;
        --border-color: #D2E4D6;
        --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-family);
        background-color: var(--forest-bg);
        color: var(--text-main);
        padding: 10px 16px;
        -webkit-font-smoothing: antialiased;
      }

      .container {
        max-width: 1240px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* Compact Header */
      .header {
        background: #FFFFFF;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 8px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .header-title-box {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }

      .header h1 {
        font-size: 18px;
        color: var(--forest-dark);
        font-weight: 800;
      }

      .header-tag {
        font-size: 11px;
        background: var(--forest-light);
        color: var(--forest-green);
        padding: 2px 8px;
        border-radius: 12px;
        font-weight: 700;
      }

      .reaction-bar {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .reaction-bar-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
      }

      .btn-reaction {
        background: #FFFFFF;
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .btn-reaction:hover {
        background: var(--forest-light);
      }

      .btn-reaction.active {
        background: var(--forest-green);
        color: #FFFFFF;
        border-color: var(--forest-green);
      }

      /* 12-Form Matrix (3 rows x 4 columns) */
      .matrix-section {
        background: #FFFFFF;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 10px 14px;
      }

      .matrix-col-headers {
        display: grid;
        grid-template-columns: 100px repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 6px;
        text-align: center;
      }

      .col-header {
        font-size: 11px;
        font-weight: 700;
        color: var(--forest-green);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .matrix-rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .matrix-row {
        display: grid;
        grid-template-columns: 100px repeat(4, 1fr);
        gap: 8px;
        align-items: center;
      }

      .row-label-cell {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 6px 8px;
        border-radius: 8px;
        border-left: 4px solid var(--forest-green);
        background: #FAFDFB;
      }

      .species-name {
        font-size: 13px;
        font-weight: 800;
        color: var(--forest-dark);
      }

      .species-id {
        font-size: 10px;
        color: var(--text-muted);
      }

      .pet-cell {
        background: #FAFDFB;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 125px;
        position: relative;
      }

      .cell-stage-tag {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 2px;
      }

      /* Bottom Reactions Showcase */
      .reactions-section {
        background: #FFFFFF;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 8px 14px;
      }

      .reactions-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .reactions-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--forest-dark);
        text-transform: uppercase;
      }

      .reactions-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .reaction-card {
        background: #FAFDFB;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .reaction-name {
        font-size: 11px;
        font-weight: 800;
        color: var(--forest-green);
        margin-bottom: 2px;
      }

      .reaction-desc {
        font-size: 9.5px;
        color: var(--text-muted);
        text-align: center;
        margin-bottom: 4px;
      }

      .reaction-previews {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      /* Compact Footer */
      .footer-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        color: var(--text-muted);
        padding: 2px 4px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/docs/evidence/v2/pet-comparison.tsx"></script>
  </body>
</html>
