    function getGlassesSvg(petId) {

            <path d="M-15 0C-24 6 -26 22 -18 28" stroke="#D48B00" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 2" fill="none"/>
          </g>
        `;

      if (petId === 'turtle') {
        return `
          <g id="acc-round_glasses-turtle">
            <ellipse cx="-16" cy="1" rx="9" ry="11" fill="#A8DADC" fill-opacity="0.30" stroke="#E09F3E" stroke-width="3.0"/>

            <path d="M5 -5C8 -9 14 -9 17 -6" stroke="#FFFFFF" stroke-width="2.0" stroke-linecap="round" fill="none"/>
            <path d="M-7 0C-4 -3 0 -3 2 0" stroke="#E09F3E" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M-25 1H-30" stroke="#E09F3E" stroke-width="2.2" stroke-linecap="round"/>

        `;

    `;

    container.innerHTML = '';

      sec.innerHTML = `<h2>${petId.toUpperCase()}</h2><div class="grid" id="grid-${petId}"></div>`;

      const grid = sec.querySelector('#grid-' + petId);

      ['baby', 'sprout', 'young', 'adult'].forEach(stage => {
        const b = WEARABLE_CONFIG.small_backpack[petId][stage];
        const n = WEARABLE_CONFIG.explorer_scarf[petId][stage];
        const f = WEARABLE_CONFIG.round_glasses[petId][stage];
        const h = WEARABLE_CONFIG.orange_cap[petId][stage];

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="stage-label">${stage.toUpperCase()}</div>
          <div class="svg-box">
            <svg viewBox="0 0 200 200" width="200" height="200">

              <g transform="translate(${b.x}, ${b.y}) scale(${b.scale}) rotate(${b.rotation || 0})">

              </g>

              <!-- Mascota -->
              <image href="/pets/${petId}/${stage}.png" x="10" y="10" width="180" height="180" preserveAspectRatio="xMidYMid meet"/>

              <!-- Pañuelo -->
              <g transform="translate(${n.x}, ${n.y}) scale(${n.scale}) rotate(${n.rotation || 0})">

              </g>

              <!-- Lentes -->
              <g transform="translate(${f.x}, ${f.y}) scale(${f.scale}) rotate(${f.rotation || 0})">

              </g>

              <!-- Gorrita -->
              <g transform="translate(${h.x}, ${h.y}) scale(${h.scale}) rotate(${h.rotation || 0})">

              </g>
            </svg>
          </div>
        `;
